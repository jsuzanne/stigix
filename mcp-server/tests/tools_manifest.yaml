# tools_manifest.yaml — Stigix MCP Tool Catalog
# Auto-generated by generate_manifest.py, manually curated.
# category: read | write | destructive
# timeout_class: fast (<10s) | medium (<60s) | long (<120s)
# size_budget_kb: max response size in KB
# scope: node | mesh | vyos | prisma | cloud
# min_node_version: minimum Stigix node version required
# nominal_args: arguments for happy-path nominal testing
# expected_keys: at least one of these must be present in nominal response
# invalid_args: list of bad arg sets (injection strings, wrong types) for robustness testing
# skip_nominal: if true, skip the nominal test (state-dependent or known orchestrator bug)
# skip_reason: human-readable explanation for skip_nominal

tools:
  add_dem_probe:
    category: write
    scope: node
    min_node_version: "2.0.0"
    size_budget_kb: 20
    timeout_class: fast
    nominal_args:
      agent_id: mock-primary
      name: "Test Probe"
      target: "https://example.com"
      probe_type: "HTTP"
    expected_keys: [success, probe, targets]
    invalid_args:
      - agent_id: mock-primary
        name: "'; DROP TABLE probes; --"
        target: "https://example.com"
        probe_type: HTTP
      - agent_id: mock-primary
        name: "Test"
        target: "javascript:alert(1)"
        probe_type: HTTP

